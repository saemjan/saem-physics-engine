name: Render Physics Video

# This triggers the factory whenever you update the CSV file
on:
  push:
    paths:
      - 'content_batch.csv'
  workflow_dispatch: 

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install System Dependencies (LaTeX & Manim Libs)
        run: |
          sudo apt update
          sudo apt install -y libcairo2-dev libpango1.0-dev ffmpeg texlive texlive-latex-extra texlive-fonts-extra texlive-latex-recommended texlive-science

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Manim Engine
        run: pip install manim pandas
          
      - name: Render the Video (High Quality)
        run: manim -qh render_physics.py PhysicsShort
        
      - name: Upload Finished MP4 to Mobile
        uses: actions/upload-artifact@v4
        with:
          name: SaemPhysics-Render
          path: media/videos/render_physics/1080p60/PhysicsShort.mp4
