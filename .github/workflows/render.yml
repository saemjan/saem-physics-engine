name: Render Physics Shorts

on:
  push:
    paths:
      - 'content_batch.csv'
  workflow_dispatch: 

jobs:
  build-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y libcairo2-dev libpango1.0-dev ffmpeg texlive texlive-latex-extra texlive-fonts-extra texlive-latex-recommended texlive-science
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Python Tools (Manim, TTS, Pandas)
        run: pip install manim pandas edge-tts
          
      - name: Generate AI Voiceover & Extract Script
        run: |
          # Extract just the script column from CSV and generate audio
          SCRIPT=$(awk -F',' 'NR==2 {print $5}' content_batch.csv)
          edge-tts --text "$SCRIPT" --voice en-IN-PrabhatNeural --write-media voiceover.mp3
          
      - name: Render Vertical Manim Video
        run: manim -qh render_pyq.py VerticalPhysics
        
      - name: Mix Audio and Video (Final Output)
        run: |
          # 1. Find the video automatically
          VIDEO_PATH=$(find media/videos -type f -name "VerticalPhysics.mp4" | head -n 1)
          cp "$VIDEO_PATH" raw_video.mp4
          
          # 2. Snap a high-quality thumbnail at the 2-second mark
          ffmpeg -ss 00:00:02 -i raw_video.mp4 -vframes 1 thumb.png
          
          # 3. Create the 440Hz studio pad and mix with the AI voice
          ffmpeg -f lavfi -i "sine=frequency=440:duration=10" -i voiceover.mp3 -filter_complex "[0:a]volume=0.08[ambient];[1:a]volume=1.5[voice];[ambient][voice]amix=inputs=2:duration=shortest[aout]" -map "[aout]" mixed_audio.aac
          
          # 4. Attach the final mixed audio to the video
          ffmpeg -i raw_video.mp4 -i mixed_audio.aac -c:v copy -c:a aac -shortest Final_Short.mp4
          
      - name: Upload Final Video & Thumbnail to Mobile
        uses: actions/upload-artifact@v4
        with:
          name: SaemPhysics-Shorts-Package
          path: |
            Final_Short.mp4
            thumb.png
